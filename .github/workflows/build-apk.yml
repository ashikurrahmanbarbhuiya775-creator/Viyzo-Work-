name: Build Viyzo APK

# Debug APK for phone QA only; not a public-store release artifact.
concurrency:
  group: viyzo-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build and validate debug APK
        run: |
          set -euo pipefail
          gradle assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          # Validate package identity and version, not just that a file exists.
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.viyzo.worker' versionCode='12' versionName='1.1.1'"
          printf '%s\n' "$BADGING" | grep -F "sdkVersion:'23'"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Viyzo-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
