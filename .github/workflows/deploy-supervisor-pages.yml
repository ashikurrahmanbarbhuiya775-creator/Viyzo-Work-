name: Deploy Viyzo Supervisor Dashboard and Company Payments

on:
  push:
    branches: [main]
    paths:
      - 'supervisor-dashboard.html'
      - 'company-payments.html'
      - '.github/workflows/deploy-supervisor-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare dashboard and company payment pages
        run: |
          mkdir -p _site
          cp supervisor-dashboard.html _site/index.html
          cp company-payments.html _site/company-payments.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
