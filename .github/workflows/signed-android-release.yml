name: Signed Android Release

# Manual-only: this workflow publishes a signed AAB only when protected signing
# secrets are configured. It does not publish to Google Play automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viyzo-signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require protected signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Actions secrets. No release artifact was built."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/viyzo-release.jks"
          test -s "$RUNNER_TEMP/viyzo-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/viyzo-release.jks" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build signed Android App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle bundleRelease
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          sha256sum "$AAB" > "$AAB.sha256"

      - name: Upload signed bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: Viyzo-Signed-Release-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/viyzo-release.jks"
